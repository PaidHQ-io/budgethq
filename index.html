<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Renamed to favicon-p-blue.svg (2026-08-19) — a ?v=2 query-param cache-bust on the old
         /favicon.svg URL wasn't enough: browser favicon caches are notoriously separate from
         normal page/HTTP caching and can ignore query strings entirely, serving the old icon at
         the same path even in a fresh incognito window. Verified server-side that both the HTML
         and the old versioned URL were already serving the correct bytes before concluding this
         needed an actually-different filename, not just a different query string, to reliably
         bust every browser's favicon cache. If the artwork changes again later, rename the file
         again (e.g. favicon-p-blue-2.svg) rather than reusing this name with a new query param. -->
    <link rel="icon" type="image/svg+xml" href="/favicon-p-blue.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaidHQ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Poppins (2026-07-31): the Aida appearance theme's font (see core.js THEME_AIDA/Settings'
         Appearance card). Loaded unconditionally alongside DM Sans rather than injected on
         switch, same reasoning as loading DM Sans itself up front — one extra ~15KB font family
         is a non-issue for a single-user admin tool, and it means switching themes is instant
         with no flash-of-unstyled-font on the first render after a switch. Weight 800 added
         2026-08-01 (per Mo) — several Aida headers use fontWeight:800 (e.g. Dashboard's "PaidHQ"
         h1), which without this weight file the browser was faux-bolding from 700 instead of
         rendering Poppins's real ExtraBold glyphs. -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <!-- Inter (2026-08-19): the Notion appearance theme's font (see core.js THEME_NOTION/Settings'
         Appearance card) — matches VaultHQ's own font per Mo's BudgetHQ-Notion-Redesign-Prompt.md.
         Loaded unconditionally alongside DM Sans/Poppins, same reasoning as those two: no
         flash-of-unstyled-font on first render after switching themes. Weights cover the same
         300-800 range as Poppins in case a later Phase 2 layout pass wants a heavier page-title
         weight the way Aida's h1 does. -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
