<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Favicon (2026-08-19, per Mo — "something really simple yet powerful... circular and in our
       classic blue color"). Solid #006CFF circle with a bold white "P" monogram, no
       gradients/shadows/blur -- legible at the smallest favicon sizes.

       RENAMED from favicon.svg (2026-08-19, per Mo — the query-param cache-bust (?v=2) wasn't
       enough: even in a fresh incognito window, some browsers' favicon-specific cache (separate
       from normal HTTP/page cache, and in Chrome's case tied to a profile-level icon database that
       can bleed into "private" windows for a previously-seen origin) kept serving the old purple
       mark at the same URL, ignoring the query string entirely. Confirmed server-side everything
       was already correct (fetched the live HTML + the old /favicon.svg?v=2 URL directly — both
       were serving the right bytes) before concluding this was a pure client-cache issue that only
       a genuinely different filename, not just a different query string, reliably busts. -->
  <circle cx="24" cy="24" r="24" fill="#006CFF"/>
  <path d="M16 12 L28 12 A8 8 0 0 1 28 28 L16 28 Z" fill="#FFFFFF"/>
  <rect x="16" y="12" width="6" height="24" rx="3" fill="#FFFFFF"/>
</svg>
