<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <!-- Favicon (2026-08-19, per Mo — "something really simple yet powerful... circular and in our
       classic blue color"). Replaces the prior multi-layer purple gradient mark, which no longer
       matched the app's actual branding (THEME_CLASSIC's accent is #006CFF blue, not purple) and
       was too detailed to read at 16px tab size anyway. Solid #006CFF circle with a bold white "P"
       monogram, no gradients/shadows/blur -- legible at the smallest favicon sizes. -->
  <circle cx="24" cy="24" r="24" fill="#006CFF"/>
  <path d="M16 12 L28 12 A8 8 0 0 1 28 28 L16 28 Z" fill="#FFFFFF"/>
  <rect x="16" y="12" width="6" height="24" rx="3" fill="#FFFFFF"/>
</svg>
